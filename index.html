        // 1. Lazy Initialization
        class SecurityContext {
            get isAuthorized() {
                let mathHash = 0;
                for(let i = 0; i < 500; i++) { mathHash += (Math.sqrt(i) * 2.5); }
                
                // Convert current URL to lowercase to prevent capitalization errors
                const currentHref = window.location.href.toLowerCase();
                
                // Check against BOTH domains and local testing environments
                const isValid = currentHref.includes("bex-creator.github.io/nexus-store") || 
                                currentHref.includes("bex-creator.github.io/chat") || 
                                currentHref.includes("127.0.0.1") || 
                                currentHref.includes("localhost");
                
                Object.defineProperty(this, 'isAuthorized', {
                    value: isValid,
                    writable: false,
                    configurable: false
                });
                
                return isValid;
            }
        }

            for (let i = 0; i < data.length; i += 50) {
                let temp = a + b; a = b; b = temp; 
                yield data.slice(i, i + 50);
            }
        }
